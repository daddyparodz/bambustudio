name: Validate Packaging

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'packaging/**'
      - 'scripts/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'packaging/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: validate-package-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    container:
      image: ubuntu:24.04
      env:
        DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap container
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            build-essential \
            ca-certificates \
            curl \
            debhelper \
            desktop-file-utils \
            devscripts \
            distro-info \
            distro-info-data \
            dput \
            gh \
            git \
            gnupg \
            jq \
            lintian \
            openssh-client \
            python3 \
            python3-launchpadlib \
            python3-paramiko \
            xdg-utils \
            xz-utils
          rm -rf /var/lib/apt/lists/*

          command -v bash
          command -v curl
          command -v debuild
          command -v dpkg-buildpackage
          command -v dpkg-deb
          command -v dpkg-source
          command -v dput
          command -v gh
          command -v git
          command -v gpg
          command -v jq
          command -v lintian
          command -v python3
          command -v ssh
          command -v ssh-keyscan
          command -v ubuntu-distro-info
          python3 -c "import paramiko; from launchpadlib.launchpad import Launchpad"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Check shell syntax
        run: |
          bash -n scripts/*.sh scripts/lib/*.sh

      - name: Run cleanup gate regression
        run: |
          python3 -m unittest discover -s tests -p 'test_cleanup_pending.py'
          python3 -m unittest discover -s tests -p 'test_release_state_tracking.py'

      - name: Build source package
        run: |
          series="$(./scripts/list-ubuntu-series.sh | awk '{print $NF}')"
          test -n "$series"
          echo "Validating against Ubuntu series: $series"
          ./scripts/build-source-package.sh --series "$series"

      - name: Lint generated source package
        run: |
          lintian --fail-on error dist/*.dsc dist/*_source.changes

      - name: Validate generated source and binary payloads
        run: |
          ./scripts/validate-generated-packages.sh dist
