# E2E production pipeline probe: 2026-08-18
name: Sync Launchpad PPA

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-ppa.yml'
      - '.github/workflows/sync-ppa-channel.yml'
      - 'packaging/**'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/sync-ppa.yml'
      - '.github/workflows/sync-ppa-channel.yml'
      - 'packaging/**'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional upstream tag to package
        required: false
        type: string
      channel:
        description: Release channel to package
        required: false
        default: stable
        type: choice
        options:
          - stable
          - beta
      ppa_revision:
        description: Optional PPA revision override (normally auto-managed)
        required: false
        type: string
      upload:
        description: Upload to Launchpad
        required: false
        default: true
        type: boolean
      series:
        description: Optional space-separated Ubuntu series override
        required: false
        type: string
      retention_versions:
        description: Maximum source versions retained per package and Ubuntu series after upload
        required: false
        default: 3
        type: number
      cleanup_only:
        description: Prune the PPA without building or uploading packages
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-ppa-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prune:
    name: prune PPA retention
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.upload || inputs.cleanup_only)
    runs-on: [self-hosted, linux, x64]
    container:
      image: ubuntu:24.04
      env:
        DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    outputs:
      cleanup_pending: ${{ steps.retention.outputs.cleanup_pending }}
      deletion_requests: ${{ steps.retention.outputs.deletion_requests }}
      pending_deleted: ${{ steps.retention.outputs.pending_deleted }}
    steps:
      - name: Bootstrap cleanup container
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            dpkg \
            git \
            jq \
            python3 \
            python3-launchpadlib
          rm -rf /var/lib/apt/lists/*
          command -v dpkg
          command -v git
          command -v jq
          python3 -c "from launchpadlib.launchpad import Launchpad"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Enforce PPA retention
        id: retention
        env:
          LAUNCHPAD_CREDENTIALS: ${{ secrets.LAUNCHPAD_CREDENTIALS }}
          RETENTION_VERSIONS: ${{ inputs.retention_versions || 3 }}
        run: |
          set -euo pipefail
          result="$(mktemp)"
          bash ./scripts/prune-ppa.sh \
            --owner daddyparodz \
            --archive bambustudio \
            --package bambustudio \
            --package bambustudio-beta \
            --keep-versions "$RETENTION_VERSIONS" \
            --result-json "$result"
          jq . "$result"
          cleanup_pending="$(jq -er '.cleanup_pending | if type == "boolean" then tostring else error("Expected boolean cleanup_pending") end' "$result")"
          echo "cleanup_pending=$cleanup_pending" >> "$GITHUB_OUTPUT"
          echo "deletion_requests=$(jq -er '.deletion_requests' "$result")" >> "$GITHUB_OUTPUT"
          echo "pending_deleted=$(jq -er '.pending_deleted' "$result")" >> "$GITHUB_OUTPUT"

      - name: Report cleanup gate
        run: |
          if [[ "${{ steps.retention.outputs.cleanup_pending }}" == "true" ]]; then
            echo "Older PPA publications are still being removed. Skipping package build/upload in this run."
          else
            echo "PPA retention is clean; package sync may proceed."
          fi

  sync:
    name: sync (${{ matrix.channel }})
    needs: prune
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      !(github.event_name == 'workflow_dispatch' && inputs.cleanup_only) &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' && !inputs.upload) ||
        (needs.prune.result == 'success' && needs.prune.outputs.cleanup_pending != 'true')
      )
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.channel) || '["stable","beta"]') }}
    uses: ./.github/workflows/sync-ppa-channel.yml
    with:
      channel: ${{ matrix.channel }}
      release_tag: ${{ inputs.release_tag || '' }}
      ppa_revision: ${{ inputs.ppa_revision || '' }}
      upload: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload) || (github.event_name != 'workflow_dispatch' && github.event_name != 'pull_request') }}
      series: ${{ inputs.series || '' }}
      retention_versions: ${{ inputs.retention_versions || 3 }}
    secrets: inherit
