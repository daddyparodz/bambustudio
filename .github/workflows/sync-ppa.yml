# E2E production pipeline probe: 2026-08-18
name: Sync Launchpad PPA

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-ppa.yml'
      - '.github/workflows/sync-ppa-channel.yml'
      - 'packaging/**'
      - 'scripts/**'
  pull_request:
    paths:
      - '.github/workflows/sync-ppa.yml'
      - '.github/workflows/sync-ppa-channel.yml'
      - 'packaging/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional upstream tag to package
        required: false
        type: string
      channel:
        description: Release channel to package
        required: false
        default: stable
        type: choice
        options:
          - stable
          - beta
      ppa_revision:
        description: Optional PPA revision override (normally auto-managed)
        required: false
        type: string
      upload:
        description: Upload to Launchpad
        required: false
        default: true
        type: boolean
      series:
        description: Optional space-separated Ubuntu series override
        required: false
        type: string
      retention_versions:
        description: Maximum source versions retained per package and Ubuntu series after upload
        required: false
        default: 3
        type: number
      cleanup_only:
        description: Prune the PPA without building or uploading packages
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-ppa-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prune:
    name: prune PPA retention
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.upload || inputs.cleanup_only)
    runs-on: [self-hosted, linux, x64]
    container:
      image: ubuntu:24.04
      env:
        DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    outputs:
      cleanup_pending: ${{ steps.retention.outputs.cleanup_pending }}
      deletion_requests: ${{ steps.retention.outputs.deletion_requests }}
      pending_deleted: ${{ steps.retention.outputs.pending_deleted }}
    steps:
      - name: Bootstrap cleanup container
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            dpkg \
            git \
            jq \
            python3 \
            python3-launchpadlib
          rm -rf /var/lib/apt/lists/*
          command -v dpkg
          command -v git
          command -v jq
          python3 -c "from launchpadlib.launchpad import Launchpad"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Enforce PPA retention
        id: retention
        env:
          LAUNCHPAD_CREDENTIALS: ${{ secrets.LAUNCHPAD_CREDENTIALS }}
          RETENTION_VERSIONS: ${{ inputs.retention_versions || 3 }}
        run: |
          set -euo pipefail
          result="$(mktemp)"
          bash ./scripts/prune-ppa.sh \
            --owner daddyparodz \
            --archive bambustudio \
            --package bambustudio \
            --package bambustudio-beta \
            --keep-versions "$RETENTION_VERSIONS" \
            --result-json "$result"
          jq . "$result"
          echo "cleanup_pending=$(jq -er '.cleanup_pending' "$result")" >> "$GITHUB_OUTPUT"
          echo "deletion_requests=$(jq -er '.deletion_requests' "$result")" >> "$GITHUB_OUTPUT"
          echo "pending_deleted=$(jq -er '.pending_deleted' "$result")" >> "$GITHUB_OUTPUT"

      - name: Report cleanup gate
        run: |
          if [[ "${{ steps.retention.outputs.cleanup_pending }}" == "true" ]]; then
            echo "Older PPA publications are still being removed. Skipping package build/upload in this run."
          else
            echo "PPA retention is clean; package sync may proceed."
          fi

  sync:
    name: sync (${{ matrix.channel }})
    needs: prune
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      !(github.event_name == 'workflow_dispatch' && inputs.cleanup_only) &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' && !inputs.upload) ||
        (needs.prune.result == 'success' && needs.prune.outputs.cleanup_pending != 'true')
      )
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.channel) || '["stable","beta"]') }}
    uses: ./.github/workflows/sync-ppa-channel.yml
    with:
      channel: ${{ matrix.channel }}
      release_tag: ${{ inputs.release_tag || '' }}
      ppa_revision: ${{ inputs.ppa_revision || '' }}
      upload: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload) || (github.event_name != 'workflow_dispatch' && github.event_name != 'pull_request') }}
      series: ${{ inputs.series || '' }}
      retention_versions: ${{ inputs.retention_versions || 3 }}
    secrets: inherit


  diagnose_launchpad_state:
    name: diagnose Launchpad publication state
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/async-launchpad-verification'
    runs-on: [self-hosted, linux, x64]
    container:
      image: ubuntu:24.04
      env:
        DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap diagnostic container
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-launchpadlib
          rm -rf /var/lib/apt/lists/*
          python3 -c "from launchpadlib.launchpad import Launchpad"

      - name: Read Launchpad publication state
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import time
          from collections import Counter, defaultdict

          from launchpadlib.launchpad import Launchpad
          from lazr.restfulclient.errors import ServerError

          OWNER = "daddyparodz"
          ARCHIVE = "bambustudio"
          PACKAGES = ("bambustudio", "bambustudio-beta")

          def retry_read(label, fn):
              delays = (1, 2, 4)
              for attempt in range(1, 5):
                  try:
                      return fn()
                  except ServerError as exc:
                      if attempt == 4:
                          raise
                      print(f"READ_RETRY label={label!r} attempt={attempt}/4 error={exc}")
                      time.sleep(delays[attempt - 1])

          def prop(obj, name, default=None):
              return retry_read(name, lambda: getattr(obj, name, default))

          def series_name(pub):
              series = retry_read("publication distro_series", lambda: getattr(pub, "distro_series", None))
              if series is None:
                  return "unknown"
              return str(
                  retry_read("distro series name", lambda: getattr(series, "name", ""))
                  or retry_read("distro series self_link", lambda: getattr(series, "self_link", ""))
                  or "unknown"
              )

          lp = Launchpad.login_anonymously(
              "bambustudio-ppa-readonly-diagnostic",
              "production",
              version="devel",
          )
          ppa = retry_read(
              "PPA lookup",
              lambda: lp.people[OWNER].getPPAByName(name=ARCHIVE),
          )

          aggregate = {
              "packages": {},
              "deleted_total": 0,
              "deleted_with_schedule": 0,
              "deleted_with_date_removed": 0,
              "deleted_schedule_and_removed": 0,
              "deleted_schedule_without_removed": 0,
              "deleted_without_schedule": 0,
              "published_total": 0,
              "superseded_total": 0,
          }

          for pkg in PACKAGES:
              pkg_summary = {}
              for status in ("Published", "Superseded", "Deleted"):
                  pubs = retry_read(
                      f"{pkg} {status} collection",
                      lambda pkg=pkg, status=status: list(
                          ppa.getPublishedSources(
                              source_name=pkg,
                              exact_match=True,
                              status=status,
                              order_by_date=True,
                          )
                      ),
                  )
                  series_counts = Counter(series_name(pub) for pub in pubs)
                  versions = [str(prop(pub, "source_package_version", "") or "") for pub in pubs]
                  pkg_summary[status.lower()] = {
                      "count": len(pubs),
                      "by_series": dict(sorted(series_counts.items())),
                      "versions": versions,
                  }
                  if status == "Published":
                      aggregate["published_total"] += len(pubs)
                  elif status == "Superseded":
                      aggregate["superseded_total"] += len(pubs)
                  else:
                      aggregate["deleted_total"] += len(pubs)
                      for pub in pubs:
                          scheduled = prop(pub, "scheduled_deletion_date", None) or prop(pub, "scheduleddeletiondate", None)
                          removed = prop(pub, "date_removed", None) or prop(pub, "dateremoved", None)
                          made_pending = prop(pub, "date_made_pending", None) or prop(pub, "datemadepending", None)
                          record = {
                              "package": pkg,
                              "series": series_name(pub),
                              "version": str(prop(pub, "source_package_version", "") or ""),
                              "status": str(prop(pub, "status", "") or ""),
                              "scheduled_deletion_date": str(scheduled) if scheduled else None,
                              "date_removed": str(removed) if removed else None,
                              "date_made_pending": str(made_pending) if made_pending else None,
                              "self_link": str(prop(pub, "self_link", "") or ""),
                          }
                          if scheduled:
                              aggregate["deleted_with_schedule"] += 1
                          else:
                              aggregate["deleted_without_schedule"] += 1
                          if removed:
                              aggregate["deleted_with_date_removed"] += 1
                          if scheduled and removed:
                              aggregate["deleted_schedule_and_removed"] += 1
                          if scheduled and not removed:
                              aggregate["deleted_schedule_without_removed"] += 1
                          print("DELETED_RECORD " + json.dumps(record, sort_keys=True))

              aggregate["packages"][pkg] = pkg_summary

          print("LAUNCHPAD_PUBLICATION_SUMMARY " + json.dumps(aggregate, sort_keys=True))
          PY
