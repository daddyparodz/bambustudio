name: Sync Launchpad PPA Channel

on:
  workflow_call:
    inputs:
      channel:
        description: Release channel to package
        required: true
        type: string
      release_tag:
        description: Optional upstream tag to package
        required: false
        default: ''
        type: string
      ppa_revision:
        description: Optional PPA revision override
        required: false
        default: ''
        type: string
      upload:
        description: Upload to Launchpad
        required: false
        default: true
        type: boolean
      series:
        description: Optional space-separated Ubuntu series override
        required: false
        default: ''
        type: string
      retention_versions:
        description: Maximum source versions retained per package and Ubuntu series after upload
        required: false
        default: 3
        type: number

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: ${{ inputs.channel }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    container:
      image: ubuntu:24.04
      env:
        DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap container
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            build-essential \
            ca-certificates \
            curl \
            debhelper \
            desktop-file-utils \
            devscripts \
            distro-info \
            distro-info-data \
            dput \
            gh \
            git \
            gnupg \
            jq \
            openssh-client \
            python3 \
            python3-launchpadlib \
            python3-paramiko \
            xdg-utils \
            xz-utils
          rm -rf /var/lib/apt/lists/*

          command -v bash
          command -v curl
          command -v debuild
          command -v dput
          command -v gh
          command -v git
          command -v gpg
          command -v jq
          command -v python3
          command -v ssh
          command -v ssh-keyscan
          command -v ubuntu-distro-info
          python3 -c "import paramiko; from launchpadlib.launchpad import Launchpad"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Trust workspace and fetch release state
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin release-state:refs/remotes/origin/release-state
          git status --short
          git show-ref --verify refs/remotes/origin/release-state

      - name: Determine upstream tag
        id: upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SYNC_CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          channel="$SYNC_CHANNEL"
          if [[ -n "$RELEASE_TAG_INPUT" ]]; then
            tag="$RELEASE_TAG_INPUT"
          else
            tag="$(./scripts/get-latest-release-tag.sh "$channel")"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Resolve workflow settings
        id: settings
        env:
          UPLOAD_INPUT: ${{ inputs.upload }}
          REVISION_INPUT: ${{ inputs.ppa_revision }}
        run: |
          set -euo pipefail
          if [[ "$UPLOAD_INPUT" == "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production PPA uploads are allowed only from main." >&2
            exit 1
          fi
          echo "upload=$UPLOAD_INPUT" >> "$GITHUB_OUTPUT"
          echo "revision_override=$REVISION_INPUT" >> "$GITHUB_OUTPUT"

      - name: Check whether upload is needed
        id: state
        env:
          SERIES_OVERRIDE: ${{ inputs.series }}
          UPLOAD_ENABLED: ${{ steps.settings.outputs.upload }}
        run: |
          set -euo pipefail
          channel="${{ steps.upstream.outputs.channel }}"
          if [[ "$channel" == "beta" ]]; then
            source_package_name="bambustudio-beta"
          else
            source_package_name="bambustudio"
          fi

          marker_file="state/latest-${channel}-tag.txt"
          commit_file="state/latest-${channel}-commit.txt"
          revision_file="state/latest-${channel}-revision.txt"
          pending_file="state/pending-${channel}.json"
          failed_file="state/failed-${channel}.json"

          read_release_state() {
            local path="$1"
            if ! git cat-file -e "refs/remotes/origin/release-state:${path}" 2>/dev/null; then
              echo "Missing release-state marker: ${path}" >&2
              return 1
            fi
            git show "refs/remotes/origin/release-state:${path}" | tr -d '\n'
          }

          read_optional_state() {
            local path="$1"
            if git cat-file -e "refs/remotes/origin/release-state:${path}" 2>/dev/null; then
              git show "refs/remotes/origin/release-state:${path}"
            fi
          }

          recorded_tag="$(read_release_state "$marker_file")"
          recorded_commit="$(read_release_state "$commit_file")"
          recorded_revision="$(read_release_state "$revision_file")"
          current_tag="${{ steps.upstream.outputs.tag }}"
          upstream_version="${current_tag#v}"
          current_commit="${{ github.sha }}"
          revision_override="${{ steps.settings.outputs.revision_override }}"
          repo_content_changed=false
          changed_non_state_files=""
          recover=false

          if [[ -n "$SERIES_OVERRIDE" ]]; then
            series_list="$SERIES_OVERRIDE"
          else
            series_list="$(./scripts/list-ubuntu-series.sh)"
          fi

          if [[ -z "${recorded_tag//[[:space:]]/}" ]]; then
            echo "Invalid empty release tag on release-state." >&2
            exit 1
          fi
          if [[ ! "$recorded_commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid recorded release commit on release-state: $recorded_commit" >&2
            exit 1
          fi
          if [[ ! "$recorded_revision" =~ ^[0-9]+$ ]]; then
            echo "Invalid recorded release revision on release-state: $recorded_revision" >&2
            exit 1
          fi
          if ! git rev-parse --verify -q "$recorded_commit^{commit}" >/dev/null; then
            echo "Recorded release commit is not present in repository history: $recorded_commit" >&2
            exit 1
          fi

          if [[ "$UPLOAD_ENABLED" == "true" ]]; then
            pending_json="$(read_optional_state "$pending_file")"
            if [[ -n "$pending_json" ]]; then
              pending_status="$(jq -er '.status' <<<"$pending_json")"
              pending_channel="$(jq -er '.channel' <<<"$pending_json")"
              pending_revision="$(jq -er '.revision' <<<"$pending_json")"
              [[ "$pending_status" == "pending" ]] || { echo "Invalid pending state status: $pending_status" >&2; exit 1; }
              [[ "$pending_channel" == "$channel" ]] || { echo "Invalid pending state channel: $pending_channel" >&2; exit 1; }
              [[ "$pending_revision" =~ ^[0-9]+$ ]] || { echo "Invalid pending revision: $pending_revision" >&2; exit 1; }
              echo "A ${channel} release is already pending Launchpad verification at ppa${pending_revision}; skipping a new upload."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "revision=$pending_revision" >> "$GITHUB_OUTPUT"
              echo "recover=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            failed_json="$(read_optional_state "$failed_file")"
            if [[ -n "$failed_json" ]]; then
              failed_tag="$(jq -er '.tag' <<<"$failed_json")"
              failed_commit="$(jq -er '.commit' <<<"$failed_json")"
              failed_revision="$(jq -er '.revision' <<<"$failed_json")"
              failed_message="$(jq -r '.message // "unknown Launchpad failure"' <<<"$failed_json")"
              [[ "$failed_commit" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Invalid failed release commit: $failed_commit" >&2; exit 1; }
              [[ "$failed_revision" =~ ^[0-9]+$ ]] || { echo "Invalid failed release revision: $failed_revision" >&2; exit 1; }

              if [[ "$failed_tag" == "$current_tag" ]]; then
                if [[ "$failed_commit" == "$current_commit" ]]; then
                  echo "The current ${channel} release previously failed at ppa${failed_revision}: ${failed_message}" >&2
                  exit 1
                fi
                if git rev-parse --verify -q "$failed_commit^{commit}" >/dev/null && \
                   git merge-base --is-ancestor "$failed_commit" "$current_commit"; then
                  changed_release_inputs="$(
                    git diff --name-only "$failed_commit..$current_commit" \
                      | grep -E '^(\.github/workflows/|packaging/|scripts/)' \
                      || true
                  )"
                  if [[ -z "$changed_release_inputs" ]]; then
                    echo "The latest ${channel} failure is unresolved and release inputs have not changed: ${failed_message}" >&2
                    exit 1
                  fi
                  echo "Release inputs changed since the failed ${channel} ppa${failed_revision}; allowing a superseding upload."
                fi
              fi
            fi
          fi

          if ! archive_max_revision="$(
            bash ./scripts/get-ppa-max-revision.sh \
              --package "$source_package_name" \
              --upstream-version "$upstream_version" \
              --series "$series_list"
          )"; then
            echo "Could not determine the maximum historical PPA revision safely." >&2
            exit 1
          fi
          if ! [[ "$archive_max_revision" =~ ^[0-9]+$ ]]; then
            echo "Invalid maximum PPA revision returned: $archive_max_revision" >&2
            exit 1
          fi
          echo "Archive max revision for ${source_package_name} ${current_tag}: ${archive_max_revision}"

          recovery_candidate=0
          if [[ -z "$revision_override" && "$UPLOAD_ENABLED" == "true" ]]; then
            if [[ "$recorded_tag" != "$current_tag" && "$archive_max_revision" -gt 0 ]]; then
              recovery_candidate="$archive_max_revision"
            elif [[ "$recorded_tag" == "$current_tag" && "$archive_max_revision" -gt "$recorded_revision" ]]; then
              recovery_candidate="$archive_max_revision"
            fi
          fi

          if (( recovery_candidate > 0 )); then
            recovery_error="$(mktemp)"
            recovery_status=0
            if bash ./scripts/discover-ppa-pending-manifest.sh \
              --package "$source_package_name" \
              --channel "$channel" \
              --tag "$current_tag" \
              --commit "$current_commit" \
              --revision "$recovery_candidate" \
              --series "$series_list" \
              > /tmp/recovered-ppa-pending.json 2>"$recovery_error"; then
              rm -f "$recovery_error"
              echo "Launchpad already has active ppa${recovery_candidate}; recovering it before considering a new revision."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "revision=$recovery_candidate" >> "$GITHUB_OUTPUT"
              echo "recover=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              recovery_status=$?
            fi

            if [[ "$recovery_status" -eq 3 ]]; then
              echo "Launchpad definitively has no recoverable complete ppa${recovery_candidate} across the expected series; a newer revision may be published."
              cat "$recovery_error" >&2 || true
              rm -f "$recovery_error" /tmp/recovered-ppa-pending.json
            else
              echo "Could not determine safely whether active ppa${recovery_candidate} can be recovered; refusing to upload a newer revision." >&2
              cat "$recovery_error" >&2 || true
              rm -f "$recovery_error" /tmp/recovered-ppa-pending.json
              exit "$recovery_status"
            fi
          fi

          if (( archive_max_revision > recorded_revision )); then
            base_revision="$archive_max_revision"
          else
            base_revision="$recorded_revision"
          fi

          if git merge-base --is-ancestor "$recorded_commit" "$current_commit"; then
            changed_non_state_files="$(
              git diff --name-only "$recorded_commit..$current_commit" \
                | grep -Ev '^state/(latest|pending|failed)-[a-z0-9-]+.*' \
                || true
            )"
            if [[ -n "$changed_non_state_files" ]]; then
              repo_content_changed=true
            fi
          else
            repo_content_changed=true
          fi

          if [[ -n "$changed_non_state_files" ]]; then
            echo "Changed non-state files since verified marker:"
            printf '%s\n' "$changed_non_state_files"
          else
            echo "Changed non-state files since verified marker: (none)"
          fi
          echo "Repo content changed since verified marker: ${repo_content_changed}"

          if [[ -n "$revision_override" ]]; then
            if ! [[ "$revision_override" =~ ^[0-9]+$ ]]; then
              echo "Invalid ppa_revision override: $revision_override" >&2
              exit 1
            fi
            if (( revision_override <= archive_max_revision )); then
              echo "Invalid ppa_revision override: $revision_override <= archive max $archive_max_revision for ${current_tag}" >&2
              exit 1
            fi
            revision="$revision_override"
            skip=false
          elif [[ "$recorded_tag" != "$current_tag" ]]; then
            if (( archive_max_revision > 0 )); then
              revision=$((archive_max_revision + 1))
            else
              revision=1
            fi
            skip=false
          elif [[ "$repo_content_changed" == "true" ]]; then
            revision=$((base_revision + 1))
            skip=false
          elif (( archive_max_revision > recorded_revision )); then
            revision=$((archive_max_revision + 1))
            skip=false
            echo "Only inactive/incomplete Launchpad history is ahead of verified release-state; publishing a new ppa${revision}."
          else
            revision="$recorded_revision"
            skip=true
          fi

          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "recover=$recover" >> "$GITHUB_OUTPUT"
          echo "series_list=$series_list" >> "$GITHUB_OUTPUT"

      - name: Enforce pre-upload PPA retention
        id: preupload_retention
        if: steps.state.outputs.skip != 'true' && steps.settings.outputs.upload == 'true' && github.ref == 'refs/heads/main'
        env:
          LAUNCHPAD_CREDENTIALS: ${{ secrets.LAUNCHPAD_CREDENTIALS }}
          RETENTION_VERSIONS: ${{ inputs.retention_versions }}
          CHANNEL: ${{ steps.upstream.outputs.channel }}
          RESERVE_SERIES: ${{ steps.state.outputs.series_list }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "beta" ]]; then
            source_package_name="bambustudio-beta"
          else
            source_package_name="bambustudio"
          fi

          reserve_args=(--reserve-package "$source_package_name")
          read -r -a selected_series <<< "$RESERVE_SERIES"
          (( ${#selected_series[@]} > 0 )) || { echo "No resolved Ubuntu series available for retention reservation." >&2; exit 1; }
          for series in "${selected_series[@]}"; do
            reserve_args+=(--reserve-series "$series")
          done

          result="$(mktemp)"
          bash ./scripts/prune-ppa.sh \
            --owner daddyparodz \
            --archive bambustudio \
            --package bambustudio \
            --package bambustudio-beta \
            "${reserve_args[@]}" \
            --keep-versions "$RETENTION_VERSIONS" \
            --result-json "$result"
          jq . "$result"
          cleanup_pending="$(jq -er '.cleanup_pending | if type == "boolean" then tostring else error("Expected boolean cleanup_pending") end' "$result")"
          echo "cleanup_pending=$cleanup_pending" >> "$GITHUB_OUTPUT"
          echo "pending_deleted=$(jq -er '.pending_deleted' "$result")" >> "$GITHUB_OUTPUT"
          echo "deletion_requests=$(jq -er '.deletion_requests' "$result")" >> "$GITHUB_OUTPUT"

          if [[ "$cleanup_pending" == "true" ]]; then
            echo "PPA retention cleanup is still pending; this upload is gated until Launchpad finishes removal."
          else
            echo "PPA retention has a free slot for this upload."
          fi

      - name: Recover existing Launchpad release as pending
        if: steps.state.outputs.recover == 'true' && steps.settings.outputs.upload == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          test -s /tmp/recovered-ppa-pending.json
          cp /tmp/recovered-ppa-pending.json /tmp/ppa-pending.json
          jq . /tmp/ppa-pending.json
          bash ./scripts/record-ppa-pending-state.sh \
            --channel "${{ steps.upstream.outputs.channel }}" \
            --manifest /tmp/ppa-pending.json

      - name: Import Launchpad signing key
        if: >-
          steps.state.outputs.skip != 'true' &&
          steps.settings.outputs.upload == 'true' &&
          steps.preupload_retention.outputs.cleanup_pending != 'true'
        env:
          LAUNCHPAD_GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
          LAUNCHPAD_GPG_FINGERPRINT: ${{ secrets.LAUNCHPAD_GPG_FINGERPRINT }}
        run: |
          test -n "$LAUNCHPAD_GPG_PRIVATE_KEY"
          test -n "$LAUNCHPAD_GPG_FINGERPRINT"
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$LAUNCHPAD_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "LAUNCHPAD_GPG_FINGERPRINT=$LAUNCHPAD_GPG_FINGERPRINT" >> "$GITHUB_ENV"

      - name: Build source packages
        if: >-
          steps.state.outputs.skip != 'true' &&
          (steps.settings.outputs.upload != 'true' || steps.preupload_retention.outputs.cleanup_pending != 'true')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.upstream.outputs.tag }}
          PPA_REVISION: ${{ steps.state.outputs.revision }}
          SERIES_OVERRIDE: ${{ inputs.series }}
          CHANNEL: ${{ steps.upstream.outputs.channel }}
          DEBFULLNAME: daddyparodz
          DEBEMAIL: 45983094+daddyparodz@users.noreply.github.com
        run: |
          if [[ "${{ steps.settings.outputs.upload }}" == "true" ]]; then
            export DEBSIGN_KEYID="${LAUNCHPAD_GPG_FINGERPRINT}"
            export SIGN_SOURCE=1
          else
            export SIGN_SOURCE=0
          fi
          bash ./scripts/build-ppa-source-packages.sh

      - name: Validate generated source and binary payloads
        if: >-
          steps.state.outputs.skip != 'true' &&
          (steps.settings.outputs.upload != 'true' || steps.preupload_retention.outputs.cleanup_pending != 'true')
        env:
          PPA_REVISION: ${{ steps.state.outputs.revision }}
          SOURCE_INCLUDE_MODE: auto
        run: |
          ./scripts/validate-generated-packages.sh dist

      - name: Record pending release before upload
        if: >-
          steps.state.outputs.skip != 'true' &&
          steps.settings.outputs.upload == 'true' &&
          steps.preupload_retention.outputs.cleanup_pending != 'true' &&
          github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          channel="${{ steps.upstream.outputs.channel }}"
          if [[ "$channel" == "beta" ]]; then
            source_package_name="bambustudio-beta"
          else
            source_package_name="bambustudio"
          fi
          bash ./scripts/make-ppa-pending-manifest.sh \
            --dist-dir dist \
            --package "$source_package_name" \
            --channel "$channel" \
            --tag "${{ steps.upstream.outputs.tag }}" \
            --commit "${{ github.sha }}" \
            --revision "${{ steps.state.outputs.revision }}" \
            > /tmp/ppa-pending.json
          jq . /tmp/ppa-pending.json
          bash ./scripts/record-ppa-pending-state.sh \
            --channel "$channel" \
            --manifest /tmp/ppa-pending.json

      - name: Upload to Launchpad
        if: >-
          steps.state.outputs.skip != 'true' &&
          steps.settings.outputs.upload == 'true' &&
          steps.preupload_retention.outputs.cleanup_pending != 'true'
        env:
          LAUNCHPAD_CREDENTIALS: ${{ secrets.LAUNCHPAD_CREDENTIALS }}
          LAUNCHPAD_SSH_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_SSH_PRIVATE_KEY }}
          LAUNCHPAD_SFTP_LOGIN: daddyparodz
          PPA_UPLOAD_METHOD: auto
        run: |
          echo "Starting Launchpad source upload..."
          ./scripts/upload-ppa.sh dist/*_source.changes
          echo "Launchpad source upload completed; asynchronous verification will promote the pending release."

      - name: Cleanup old workflow artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts --paginate \
            --jq '.artifacts[] | select(.name=="launchpad-source-package" or .name=="source-package") | .id' \
          | while read -r artifact_id; do
              [[ -n "$artifact_id" ]] || continue
              gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/"$artifact_id"
              echo "Deleted artifact id=$artifact_id"
            done
